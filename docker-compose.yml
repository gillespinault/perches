# Perches — une instance = un conteneur + SQLite.
services:
  perches:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: Europe/Brussels
      PERCHES_DB: /data/perches.db
      # PERCHES_BASE_URL: https://perches.exemple.be
      # PERCHES_POLITIQUE: invitation   # ouverte (défaut) | invitation | fermee
      # PERCHES_SMTP_HOTE / PORT / UTILISATEUR / MDP / DE — sans SMTP, courriels journalisés
    restart: unless-stopped
