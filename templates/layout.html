{{define "entete"}}<!doctype html>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23faf6ef'/%3E%3Cpath d='M5 24 L27 8' stroke='%237a5c3e' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
{{with .Alternate}}<link rel="alternate" type="application/json" href="{{.}}">
{{end}}{{with .OG}}<meta property="og:title" content="{{.Titre}}">

<body>
<main>
{{end}}

{{define "pied"}}
</main>
<footer>
<p>Perches — des intentions, sans obligation.</p>
</footer>
<script>
// Seule touche de JavaScript : un bouton « copier », affiché uniquement si le presse-papiers est disponible.
document.querySelectorAll("[data-copier]").forEach(function (b) {
  if (!navigator.clipboard) return;
  b.hidden = false;
  b.addEventListener("click", function () {
    navigator.clipboard.writeText(document.getElementById(b.dataset.copier).textContent.trim())
      .then(function () { b.textContent = "copié"; });
  });
});
// Aperçu vivant de l'adresse à l'ouverture d'une liste — miroir de slugDe côté serveur, qui reste l'autorité.
(function () {
  var apercu = document.getElementById("apercu-slug");
  var titre = document.querySelector('form[action="/listes"] input[name=titre]');
  if (!apercu || !titre) return;
  function slug(t) {
    t = t.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/œ/g, "o").replace(/æ/g, "a");
    t = t.replace(/^(les |la |le )?(perches?|liste) (de |d['’])/, "");
    t = t.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40).replace(/-+$/, "");
    return t || "liste";
  }
  function maj() { apercu.textContent = titre.value.trim() ? slug(titre.value) : "…"; }
  titre.addEventListener("input", maj); maj();
})();
</script>
</body>
</html>
{{end}}
