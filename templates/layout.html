<script>
// Seule touche de JavaScript : un bouton « copier », affiché uniquement si le presse-papiers est disponible.
document.querySelectorAll("[data-copier]").forEach(function (b) {
  if (!navigator.clipboard) return;
  b.hidden = false;
  b.addEventListener("click", function () {
    navigator.clipboard.writeText(document.getElementById(b.dataset.copier).textContent.trim())
      .then(function () { b.textContent = "copié"; });
  });
});
</script>
</body>
